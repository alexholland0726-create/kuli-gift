# kuli-api.conf — 酷礼工坊小程序 API 反代配置
# 归属：Hermes 管辖
# 路径：/etc/nginx/conf.d/kuli-api.conf
# 域名：api.da-fire.com → 127.0.0.1:3001
# SSL证书路径：/etc/ssl/da-fire-api/
# 创建者：Codex
# 最后确认：2026-05-31

server {
    listen 80;
    listen [::]:80;
    server_name api.da-fire.com;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/acme-challenge/.well-known/acme-challenge/;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.da-fire.com;

    ssl_certificate /etc/ssl/da-fire-api/fullchain.cer;
    ssl_certificate_key /etc/ssl/da-fire-api/api.da-fire.com.key;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }
}
