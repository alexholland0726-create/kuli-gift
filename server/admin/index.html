<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>酷礼工坊管理后台</title><link rel="stylesheet" href="/admin/style.css"><link rel="stylesheet" href="/admin/visibility.css">
</head>
<body>
  <main id="login" class="login-card">
    <div class="brand">酷礼工坊</div><h1>员工管理后台</h1><p>使用管理员分配的账号登录</p>
    <form id="login-form"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><button>登录</button><div id="login-error" class="error"></div></form>
  </main>
  <div id="app" hidden>
    <aside><div class="brand">酷礼工坊</div><button data-view="products" class="nav active">产品管理</button><button data-view="categories" class="nav">分类管理</button><button data-view="site" class="nav">首页内容</button><button data-view="orders" class="nav">订单发货</button><button data-view="inquiries" class="nav">客户询价</button><button data-view="staff" class="nav owner-only">同事账号</button><button data-view="account" class="nav">修改密码</button><button id="logout" class="quiet">退出登录</button></aside>
    <section class="workspace">
      <header><div><h1 id="title">产品管理</h1><p id="welcome"></p></div><button id="new-product">＋ 上传产品</button></header>
      <div id="page-error" class="error" role="alert"></div>
      <div id="products" class="view"><div id="product-list" class="cards"></div><div id="product-pagination" class="actions"></div></div>
      <div id="categories" class="view" hidden>
        <form id="category-form" class="inline-form"><input type="hidden" name="id"><label>分类名称<input name="name" maxlength="100" required></label><label>排序（小的在前）<input name="sort" type="number" min="0" max="2147483647" value="0" required></label><label>状态<select name="isActive"><option value="true">启用</option><option value="false">停用</option></select></label><button>保存分类</button><button type="button" id="reset-category" class="secondary">新增 / 清空</button></form>
        <div id="category-error" class="error" role="alert"></div><div id="category-list" class="cards"></div>
      </div>
      <div id="site" class="view" hidden>
        <form id="site-form" class="site-form">
          <label>首页分享标题<input name="shareTitle" maxlength="80" required></label>
          <label>首页公告<input name="notice" maxlength="200" required></label>
          <label>首页大图<input id="hero-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><input name="heroImage" maxlength="500" required><small id="hero-upload-status">可上传新图片，或填写 /static/、/uploads/、https:// 地址</small></label>
          <label>快捷入口（每行：名称|分类ID|图片地址）<textarea name="quickEntries" rows="9" required></textarea></label>
          <label>场景卡片（每行：标题|说明|分类ID|主题）<textarea name="scenes" rows="7" required></textarea><small>主题可用 festival、summer、father、deal、discount、graduate</small></label>
          <div class="actions"><button type="button" id="restore-site" class="secondary">放弃草稿</button><button type="submit" class="secondary">保存草稿</button><button type="button" id="publish-site">发布到小程序</button></div>
          <div id="site-status" class="muted"></div><div id="site-error" class="error"></div>
        </form>
      </div>
      <div id="orders" class="view" hidden><div id="order-list" class="cards"></div><div id="order-pagination" class="actions"></div></div>
      <div id="inquiries" class="view" hidden><div id="inquiry-list" class="cards"></div></div>
      <div id="staff" class="view" hidden><form id="staff-form" class="inline-form"><input name="name" placeholder="同事姓名" required><input name="username" placeholder="登录账号" required><input name="password" type="password" minlength="12" placeholder="初始密码（至少12位）" required><button>创建账号</button></form><div id="staff-list" class="cards"></div></div>
      <div id="account" class="view" hidden><form id="password-form" class="login-card"><h2>修改我的密码</h2><label>当前密码<input name="currentPassword" type="password" minlength="12" required></label><label>新密码<input name="password" type="password" minlength="12" required></label><button>保存新密码</button><div id="password-error" class="error"></div></form></div>
    </section>
  </div>
  <dialog id="product-dialog"><form id="product-form"><input type="hidden" name="id"><div class="dialog-head"><h2>产品资料</h2><button type="button" id="close-dialog" class="icon">×</button></div><div class="form-grid">
    <label class="wide">产品名称<input name="name" maxlength="200" required></label>
    <label>参考价格<input name="price" type="number" min="0" step="0.01" value="0" required><small>填 0 显示“询价”</small></label>
    <label>库存<input name="stock" type="number" min="0" value="0"></label>
    <label class="wide">所属分类<select name="categoryId"><option value="">未分类</option></select></label>
    <label class="wide">封面图片<input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><input name="coverImage" placeholder="上传后自动填写" required readonly><span id="upload-status"></span></label>
    <label class="wide">标签<input name="tags" placeholder="例如：员工福利,品牌礼品,可定制"></label>
    <label class="wide">产品说明<textarea name="description" rows="5" maxlength="10000"></textarea></label>
    <label><input name="isActive" type="checkbox"> 上架展示</label><label><input name="isRecommended" type="checkbox"> 首页推荐</label>
  </div><div class="actions"><button type="button" id="cancel-dialog" class="secondary">取消</button><button>保存产品</button></div><div id="product-error" class="error"></div></form></dialog>
  <script src="/admin/app.js"></script>
</body></html>
